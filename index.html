<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form id="registrationForm">
            <div class="grid-layout">
                <div class="form-group"><label for="district">District *</label><select id="district" required><option value="">Select District</option></select></div>
                <div class="form-group"><label for="fullName">Full Name *</label><input type="text" id="fullName" required></div>
                <div class="form-group"><label for="fatherName">Father's Name *</label><input type="text" id="fatherName" required></div>
                <div class="form-group">
                    <label for="ageGroup">Age Group *</label>
                    <select id="ageGroup" required>
                        <option value="">Select Age Group</option>
                        <option value="Sub Junior">Sub Junior</option>
                        <option value="Junior">Junior</option>
                        <option value="Senior">Senior</option>
                        <option value="Senior A">Senior A</option>
                        <option value="Senior B">Senior B</option>
                        <option value="Senior C">Senior C</option>
                    </select>
                </div>
                <div class="form-group"><label for="gender">Gender *</label><select id="gender" required><option value="">Select Gender</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                <div class="form-group"><label for="dob">Date of Birth *</label><input type="date" id="dob" required></div>
                <div class="form-group"><label for="phone">Phone No. *</label><input type="tel" id="phone" pattern="[0-9]{10}" required></div>
                <div class="form-group"><label for="aadhar">Aadhar Card No. *</label><input type="text" id="aadhar" pattern="[0-9]{12}" required></div>
                
                <!-- Event dropdown positioned right after Aadhar -->
                <div class="form-group">
                    <label for="eventSelect">Event *</label>
                    <select id="eventSelect" required>
                        <option value="">Select Event</option>
                        <option value="Traditional">Traditional</option>
                        <option value="Artistic Single">Artistic Single</option>
                        <option value="Artistic Pair">Artistic Pair</option>
                        <option value="Rhythmic Pair">Rhythmic Pair</option>
                    </select>
                </div>

                <!-- Traditional Section (O1 to O3) -->
                <div id="traditionalSection" class="conditional-section">
                    <div class="section-title">Traditional Asana Code Selection</div>
                    <div class="form-group"><label for="o1">O1 Code *</label><select id="o1" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="o2">O2 Code *</label><select id="o2" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="o3">O3 Code *</label><select id="o3" class="asana-dropdown"></select></div>
                </div>

                <!-- Artistic Section (A1 to A10) -->
                <div id="artisticSection" class="conditional-section">
                    <div class="section-title">Artistic / Rhythmic Asana Code Selection</div>
                    <div class="form-group"><label for="a1">A1 *</label><select id="a1" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a2">A2 *</label><select id="a2" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a3">A3 *</label><select id="a3" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a4">A4 *</label><select id="a4" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a5">A5 *</label><select id="a5" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a6">A6 *</label><select id="a6" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a7">A7 *</label><select id="a7" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a8">A8 *</label><select id="a8" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a9">A9 *</label><select id="a9" class="asana-dropdown"></select></div>
                    <div class="form-group"><label for="a10">A10 *</label><select id="a10" class="asana-dropdown"></select></div>
                </div>

                <div class="form-group"><label for="driveLink">Payment Proof (Google Drive Link) *</label><input type="url" id="driveLink" required></div>
                <div class="form-group">
                    <label>Upload Payment Receipt Image *</label>
                    <label class="file-wrapper" for="imageFile">Choose Image<input type="file" id="imageFile" accept="image/*" required></label>
                    <div class="preview-box" id="previewBox"><img src="" id="imagePreview" alt="Preview"></div>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn"><span class="spinner" id="btnSpinner"></span><span id="btnText">Submit Registration</span></button>
            <div class="toast success" id="successToast">🎉 Registration Successful! Data recorded.</div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
